version: "2"

run:
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    goconst:
      ignore-tests: true
      # "name" binds a survey.Question to its answer field and "Deployment" must
      # match the {{.Deployment}} placeholder in the message templates.
      ignore-string-values:
        - '^(name|Deployment)$'
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Matches both the querylegacy import path and the QueryLegacy method,
      # which staticcheck reports with the receiver's full package path.
      - linters:
          - staticcheck
        text: "SA1019: .*[qQ]uery[lL]egacy"
      - linters:
          - gosec
        text: "G115: integer overflow conversion"
      - linters:
          - gosec
        text: "G101: Potential hardcoded credentials"
        path: internal/cmd/root/help_topic.go
      - linters:
          - gosec
        text: "G705: XSS via taint analysis"
        path: tools/
      # The only form parsing happens in the loopback-only OAuth2 callback
      # server, where ParseForm's own 10MB cap already bounds it.
      - linters:
          - gosec
        text: "G120: Parsing form data without limiting request body size"
        path: internal/client/auth/
      # The redirect is the fake authorization server the login test stands up.
      - linters:
          - gosec
        text: "G710: Open redirect via taint analysis"
        path: internal/client/auth/auth_test.go
      - linters:
          - revive
        text: "var-naming: avoid package names that conflict with Go standard library package names"
    paths:
      - .git
      - .github
      - .vscode
      - bin
      - dist
      - man
      - testdata

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/axiomhq/cli
  exclusions:
    generated: lax
    paths:
      - .git
      - .github
      - .vscode
      - bin
      - dist
      - man
      - testdata
